name: 1. Bhavcopy Delivery Accumulation Scanner

on:
  schedule:
    # 13:15 UTC = 6:45 PM IST (Monday through Friday)
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

jobs:
  bhavcopy-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Bhavcopy Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: https://alphaminter-bot.adityabhandari162.workers.dev
          MIN_DELIVERY_PCT: 65.0
          MIN_DELIVERY_TURNOVER_CR: 5.0
        run: |
          python run_eod_pipeline.py
