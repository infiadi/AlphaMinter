name: 3. Buyback Arbitrage Monitor

on:
  schedule:
    # 13:45 UTC = 7:15 PM IST (Monday through Friday)
    - cron: '45 13 * * 1-5'
  workflow_dispatch:

jobs:
  buyback-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Buyback Arbitrage Calculator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: https://alphaminter-bot.adityabhandari162.workers.dev
        run: |
          python run_buyback_pipeline.py
