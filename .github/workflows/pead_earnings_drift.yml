name: 2. PEAD Earnings Drift Scanner

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST (Monday through Saturday)
    - cron: '30 13 * * 1-6'
  workflow_dispatch:

jobs:
  pead-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute PEAD Earnings Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: https://alphaminter-bot.adityabhandari162.workers.dev
        run: |
          python run_pead_pipeline.py
